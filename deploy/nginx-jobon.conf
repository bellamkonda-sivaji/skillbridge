# JobOn vhosts for the shared nginx on the mindsyncos server.
#
# This is a fragment, not a whole config. Paste both server blocks inside
# the existing http { } block of /opt/mindsync/nginx.conf, and add the three
# JobOn names to the server_name list of the HTTP->HTTPS redirect block near
# the top of that file:
#
#   ... myinflue.mindsyncos.com jobon.mindsyncos.com
#       jobon-api.mindsyncos.com jobon.api.mindsyncos.com;
#
# That file fronts mindsyncos, myinflue and tnetwork as well, so check it
# before reloading:
#
#   docker exec mindsync-nginx-1 nginx -t && docker exec mindsync-nginx-1 nginx -s reload
#
# A syntax error here takes every site on the box down, not just this one.

  # ── JobOn Backend — jobon-api.mindsyncos.com ─────────────────────────────
  # jobon.api.* is served too: it is the name currently in DNS. jobon-api
  # matches how myinflue-api and tnetwork-api are named, so it is the one to
  # keep once its A record exists.
  server {
    listen 443 ssl;
    server_name jobon-api.mindsyncos.com jobon.api.mindsyncos.com;

    ssl_certificate     /etc/letsencrypt/live/mindsyncos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindsyncos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Profile and joining photos arrive as base64 data URLs inside the JSON
    # body, so requests are far larger than a plain API's.
    client_max_body_size 50M;

    location / {
      set $upstream_jobonapi jobon-backend:8080;
      proxy_pass http://$upstream_jobonapi;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 120s;
      proxy_connect_timeout 120s;
    }
  }

  # ── JobOn Admin Console — jobon.mindsyncos.com ───────────────────────────
  server {
    listen 443 ssl;
    server_name jobon.mindsyncos.com;

    ssl_certificate     /etc/letsencrypt/live/mindsyncos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindsyncos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
      set $upstream_jobonweb jobon-frontend:80;
      proxy_pass http://$upstream_jobonweb;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 120s;
      proxy_connect_timeout 120s;
    }
  }
