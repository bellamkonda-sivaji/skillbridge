spring:
  application:
    name: skillbridge-backend
  datasource:
    # In-memory H2 by default, so a fresh clone runs with no database to set
    # up and the seeder gives you a working demo. Every deployed environment
    # overrides these: H2 in memory loses every account on restart.
    url: ${DB_URL:jdbc:h2:mem:skillbridge;DB_CLOSE_DELAY=-1;MODE=LEGACY}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Left unset so Hibernate detects it from the connection. Naming a
        # dialect here would pin every environment to H2.
  h2:
    console:
      # A web SQL console over the whole database. Fine on a laptop, never
      # on a server - SecurityConfig lets /h2-console through unauthenticated.
      enabled: ${H2_CONSOLE:false}
      path: /h2-console

server:
  port: 8080

skillbridge:
  jwt:
    # Anyone holding this can mint a valid admin token, so a deployed
    # environment must set JWT_SECRET. The default exists only so a fresh
    # clone starts; it is public in the repository and worthless as a secret.
    secret: "${JWT_SECRET:SkillBridgeSecretKeyForJwtSigning2026!SecureEnoughForProductionUse}"
    expiration-ms: 86400000
  pricing:
    # Platform fee on worker earnings, percent. Drives the schedule estimate and /api/config/pricing.
    platform-fee-percent: 5
  fcm:
    # Path to the Firebase service account JSON. Blank by default: with no key
    # the server stores device tokens but never sends, which is what we want in
    # development and in tests. Never commit the key - it can notify every user
    # of the product. Set FCM_CREDENTIALS in the environment instead.
    credentials: "${FCM_CREDENTIALS:}"
  razorpay:
    # All blank by default: with no keys the gateway calls answer 503
    # RAZORPAY_NOT_CONFIGURED, the webhook signature never verifies, reconciliation
    # no-ops, and the MANUAL funding path is how a job gets money behind it.
    # keyId/keySecret are Razorpay Payments (money in); accountNumber is the
    # RazorpayX account payouts are drawn from (money out).
    keyId: "${RAZORPAY_KEY_ID:}"
    keySecret: "${RAZORPAY_KEY_SECRET:}"
    webhookSecret: "${RAZORPAY_WEBHOOK_SECRET:}"
    accountNumber: "${RAZORPAY_ACCOUNT_NUMBER:}"
  leads:
    # Shared secret for POST /api/leads/inbound (header X-Lead-Token). Blank by default, and
    # blank means the endpoint answers 503 rather than accepting unauthenticated leads - a public
    # write endpoint with no secret is a spam pipe straight into the call queue.
    inbound-token: "${LEADS_INBOUND_TOKEN:}"
  otp:
    length: 6
    ttl-seconds: 300
    resend-after-seconds: 30
    max-attempts: 5
    # DEV ONLY: returns the OTP in the API response so the flow is testable
    # without an SMS provider. MUST be false in production.
    expose-code: true

logging:
  level:
    org.springframework.security: INFO
