spring:
  application:
    name: skillbridge-backend
  datasource:
    url: jdbc:h2:mem:skillbridge;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

skillbridge:
  jwt:
    secret: "SkillBridgeSecretKeyForJwtSigning2026!SecureEnoughForProductionUse"
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO
