spring:
  application:
    name: skillbridge-backend
  datasource:
    url: jdbc:h2:mem:skillbridge;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

skillbridge:
  jwt:
    secret: "SkillBridgeSecretKeyForJwtSigning2026!SecureEnoughForProductionUse"
    expiration-ms: 86400000
  pricing:
    # Platform fee on worker earnings, percent. Drives the schedule estimate and /api/config/pricing.
    platform-fee-percent: 5
  otp:
    length: 6
    ttl-seconds: 300
    resend-after-seconds: 30
    max-attempts: 5
    # DEV ONLY: returns the OTP in the API response so the flow is testable
    # without an SMS provider. MUST be false in production.
    expose-code: true

logging:
  level:
    org.springframework.security: INFO
