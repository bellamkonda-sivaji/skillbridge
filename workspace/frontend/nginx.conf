server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Request-time resolution via Docker's embedded DNS. A plain upstream
    # block fails nginx startup outright if the backend container is down,
    # which would take this site with it; this way a stopped backend 502s
    # the API calls and the page itself still loads.
    resolver 127.0.0.11 valid=10s;

    # The admin app calls /api with a relative URL - in development Vite
    # proxies it, so in production nginx has to do the same job.
    location /api/ {
        set $backend jobon-backend:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Live notifications ride a STOMP websocket. Without the Upgrade headers
    # this silently degrades: the page loads, but the admin console stops
    # updating and nothing announces why.
    location /ws {
        set $ws jobon-backend:8080;
        proxy_pass http://$ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Client-side routing: unknown paths are React Router's, not nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
